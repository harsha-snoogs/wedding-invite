<!DOCTYPE html>
<html lang="en" class="locked">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#3e0d16">
  <title>Snegha Weds Ashwin — A Cinematic Wedding Journey</title>
  <meta name="description" content="Follow Snegha & Ashwin through a cinematic frame-by-frame wedding experience.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap">
  <link rel="preload" as="image" href="/assets/logo/ashwin-snegha.webp" type="image/webp" fetchpriority="high">
  <link rel="preload" as="image" href="/assets/film/01-opening.avif" type="image/avif" fetchpriority="high">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>

  <!-- Cover: shows while the film loads, then becomes the "Open invitation" tap. That tap
       is what lets the browser start the music. The cover is a length of maroon Kanchipuram
       silk with a gold temple border; it opens down the middle like temple doors. -->
  <div id="loader" role="dialog" aria-label="Wedding invitation">
    <div class="door door-l" aria-hidden="true"></div>
    <div class="door door-r" aria-hidden="true"></div>
    <div class="door-seam" aria-hidden="true"></div>
    <div class="cover-sheen" aria-hidden="true"></div>
    <div class="cover-content">
      <p class="cover-eyebrow">You're invited to</p>
      <div class="cover-logo" id="cover-logo" role="img"><i></i></div>
      <p class="cover-eyebrow">marriage</p>
      <span class="cover-rule" aria-hidden="true"></span>
      <p class="cover-date" data-date-long></p>
      <div class="cover-action">
        <div class="loader-track"><div class="loader-fill" id="loader-fill"></div></div>
        <button class="cover-open" id="cover-open" type="button"><span>Open invitation</span></button>
      </div>
      <p class="cover-hint"><span aria-hidden="true">♪</span> with music</p>
    </div>
  </div>

  <canvas id="film-canvas" aria-hidden="true"></canvas>

  <!-- Soft colour fades at the screen edges, matched to the picture, so the phone's status
       bar and toolbar take on the photo's colour instead of a flat background. -->
  <div class="edge-tint top" id="edge-top" aria-hidden="true"></div>
  <div class="edge-tint bottom" id="edge-bottom" aria-hidden="true"></div>

  <!-- Words during the film stay small: who and when, plus a one-line journey note as
       each moment settles (added from weddingData.js). The pictures carry the rest. -->
  <div class="film-text" id="film-text">
    <div class="ov ov-title" id="ov-title">
      <p class="ov-eyebrow">The wedding of</p>
      <h1 class="ov-names" data-names="&amp;"></h1>
      <p class="ov-date" data-date></p>
    </div>

    <div class="ov ov-wed" id="ov-wed">
      <p class="ov-eyebrow" data-finale-line></p>
      <h2 class="ov-names" data-names="weds"></h2>
      <p class="ov-date" data-date-long></p>
    </div>

    <div class="ov ov-cue" id="ov-cue">
      <span>Scroll</span>
      <i></i>
    </div>
  </div>

  <header class="chrome-top">
    <a class="mono" href="#" id="to-top" aria-label="Back to the start">S &amp; A</a>
    <button class="music-btn" id="music-toggle" type="button" aria-pressed="false" aria-label="Play music">
      <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>Music</span>
    </button>
  </header>

  <div class="chrome-bottom">
    <div class="progress" aria-hidden="true"><span id="progress-fill"></span></div>
    <a class="skip" href="#details" id="skip">Wedding details</a>
  </div>

  <main>
    <section id="film" aria-label="The story of Snegha and Ashwin, told in pictures"></section>
    <section id="details" aria-label="Wedding details"></section>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
